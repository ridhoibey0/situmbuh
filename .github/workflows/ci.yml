name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  laravel:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: situba_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: bcmath, ctype, curl, fileinfo, gd, mbstring, openssl, pdo_mysql, tokenizer, xml, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Composer validate
        run: composer validate --no-check-publish

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Pint (lint)
        run: vendor/bin/pint --test

      - name: NPM build
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      - name: Prepare .env for test
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear

      - name: Wait MySQL
        run: |
          for i in $(seq 1 30); do
            mysql -h127.0.0.1 -uroot -proot -e "SELECT 1" && break
            sleep 2
          done

      - name: Run tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: situba_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php vendor/bin/phpunit --stop-on-failure
